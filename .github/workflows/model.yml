name: FootStats — trening modelu uczonego

# JEDEN RACHUNEK ZAMIAST FORMUŁY I DZIESIĘCIU WARSTW (2026-08-17).
#
# Zmierzone na 4398 typach, które poszły na stronę (docs/model-uczony-pomiar.md):
# luka deklaracji −14,4 pp → −0,9 pp, Brier 0,2429 → 0,2276. Model uczy się na
# magazynie historii meczowej (11 tys. meczów), a nie na przesunięciach
# własnego wyniku.
#
# DLACZEGO OSOBNY JOB: cykl ma tylko MNOŻYĆ macierze (milisekundy). Trening
# czyta cały magazyn i przelicza ~50 tys. wierszy — w cyklu dławionym przez
# cron GitHuba do co 1–3 h to strata czasu na coś, co zmienia się raz na dobę.
#
# KOLEJNOŚĆ WZGLĘDEM MAGAZYNU (2026-10-05): trening rusza PO ZAKOŃCZENIU
# magazynu (`workflow_run`). Pół godziny zapasu w cronie nie działało, bo GitHub
# odpala oba crony z opóźnieniem 5–6 h i trening startował przed końcem
# magazynu — 05.10: trening 11:52:12, magazyn skończył 11:52:26, czyli wagi
# z wczorajszych meczów. Cron zostaje jako ZAPAS na dzień, w którym magazyn
# padnie albo GitHub go nie odpali (drugi trening tego dnia nic nie psuje).

on:
  workflow_run:
    workflows: ["FootStats — magazyn historii drużyn"]
    types: [completed]
  schedule:
    - cron: "30 13 * * *"    # zapas: 13:30 UTC = 15:30 czasu polskiego
  workflow_dispatch: {}

permissions:
  contents: read

# WŁASNY group: trening czyta magazyn i zapisuje TYLKO klucz `model_wagi`,
# więc nie ściga się ani z cyklem (typy_log), ani z magazynem (hd_*).
concurrency:
  group: footstats-model
  cancel-in-progress: false

jobs:
  trenuj:
    # po magazynie tylko wtedy, gdy magazyn się udał — inaczej trenowalibyśmy
    # na niepełnych danych; zapasem jest cron
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalacja zależności
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Wytrenuj model i zapisz wagi do Supabase
        working-directory: pipeline
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # magazyn stanu pipeline'u (prywatne repo) — bez tego job PADNIE
          # w produkcji zamiast czytac pusto: patrz magazyn_repo._w_produkcji
          STAN_REPO: ${{ vars.STAN_REPO }}
          STAN_TOKEN: ${{ secrets.STAN_TOKEN }}
        run: python scripts/trenuj_model.py

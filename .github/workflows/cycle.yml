name: FootStats — cykl zbierania danych

# Darmowy cron w chmurze (GitHub Actions). Uruchamia pipeline i wypycha wyniki
# do Supabase. Aplikacja na Vercel czyta z Supabase — nic nie musi być włączone
# na komputerze użytkownika.
#
# Repo jest PUBLICZNE = nielimitowane minuty Actions, więc częstotliwość nie jest
# ograniczona minutami. GitHub dopuszcza minimum co 5 min; trzymamy 15 min, żeby
# nie prowokować rate-limitów/blokad po stronie źródeł (Sofascore/365/Superbet).
#
# UWAGA — TA DEKLARACJA JEST FIKCJĄ I TRZEBA O TYM WIEDZIEĆ (zmierzone 05.08
# na 100 przebiegach z API GitHuba, okno 183 h):
#
#     tyknięć wg `*/15`   ~732        UTWORZONYCH przez GitHuba   99  (14%)
#     odstęp UTWORZEŃ     mediana  96 min,  p90 183 min,  max 227 min
#     czekanie w kolejce  0,0 min   <- concurrency NIE jest winne
#
# Minuty odpaleń są rozrzucone po całej godzinie (0,1,2,4,7,...59), a `*/15`
# może trafiać wyłącznie w :00/:15/:30/:45. To dowód, że GitHub PRZESUWA i GUBI
# tyknięcia — nie że my je blokujemy. Zdarzenie `schedule` jest best-effort
# i pierwsze idzie pod nóż przy obciążeniu Actions. `rozlicz.yml` ma to samo
# (17% tyknięć), więc to nie jest wina tego pliku ani długości cyklu.
#
# WNIOSEK: skrócenie cyklu NIE poprawi świeżości strony. Jedyne, co realnie
# działa, to `workflow_dispatch` z zewnątrz — nie jest dławiony i odpala od
# razu. Mechanizm już mamy: `web/src/app/api/kupon-pomin/route.ts` woła go po
# akcji usera (GH_DISPATCH_TOKEN). Brakuje wyłącznie regularnego pingu.

on:
  schedule:
    - cron: "*/15 * * * *"   # co 15 min (UTC)
  workflow_dispatch: {}       # pozwala uruchomić ręcznie z zakładki Actions

# least privilege: workflow tylko czyta repo i woła zewnętrzne API (statshub/
# 365/Superbet/Supabase) — niczego nie pushuje ani nie zapisuje w GitHubie
permissions:
  contents: read

concurrency:
  group: footstats-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # 20 -> 35 (2026-08-01). Cykl trwa 16-20 min i ROŚNIE z zakresem lig, więc
    # regularnie ginął na limicie: z 19 kolejnych przebiegów SZEŚĆ skończyło się
    # statusem `cancelled` na 20,2-20,3 min. Zabity przebieg nie wypycha NICZEGO
    # (push_supabase idzie na końcu cycle.py), więc strona zostawała z danymi
    # sprzed 1-2 h przy sprawnym cronie — to jest prawdziwa przyczyna „cron się
    # dławi" z wcześniejszych diagnoz.
    #
    # Limit ZOSTAJE (a nie rośnie do maksimum), bo przebieg zawieszony na
    # padniętym źródle blokowałby kolejkę: concurrency nie przepuszcza drugiego
    # cyklu. Gdzie idą minuty — patrz stopery w cycle.py/build_league.py.
    #
    # 35 -> 50 (2026-08-05). Zmierzone na 100 przebiegach z API GitHuba:
    # mediana czasu cyklu SKOCZYŁA 03.08 -> 04.08 z 18,1 na 29,3 min, a 05.08
    # stoi na 32,0 (max 35,0 — czyli DOKŁADNIE limit). To skutek naszych zmian
    # z 03-04.08: siatka zawodnicza 185 -> 933 par i 3 -> 13 statystyk, plus
    # szersze okno zgody = więcej typów do policzenia i zarejestrowania.
    #
    # Krok obronny, nie naprawa: przebieg ubity limitem nie wypycha NICZEGO,
    # więc każde przekroczenie to kilka godzin nieświeżej strony. Prawdziwa
    # naprawa to skrócenie kroku „Przelicz okazje" — zmierzone per krok joba:
    # checkout + python + pip = 15 SEKUND, cała reszta (1719-1913 s) to nasz
    # jeden krok. Po stronie CI nie ma czego optymalizować.
    #
    # 50 -> 70 (2026-08-08). Ten sam krok obronny, ta sama przyczyna: czas
    # cyklu znowu urósł, bo silnik liczy teraz DZIEWIĘĆ RAZY więcej rynków
    # (378 -> 3450 po rozdzieleniu budżetów zapytań — patrz MAX_PERF_OFERTA
    # i MAX_SHOTMAP_OFERTA w build_wc_fast). Zmierzone tego dnia:
    #
    #     #660  15,6 min      #663  31,2 min
    #     #661  29,3 min      #664  33,3 min
    #     #662  49,7 min  <-- 18 SEKUND od limitu      #666  36,1 min
    #
    # Przebieg #662 minął się z limitem o 18 sekund. Trend jest wyraźny i idzie
    # za zakresem danych, nie za jednorazowym zacięciem źródła, więc zapas 14
    # minut jest za cienki. Repo jest publiczne = minuty Actions nielimitowane,
    # czyli ta zmiana nie kosztuje NIC poza dłuższym czekaniem w patologicznym
    # przypadku zawieszonego źródła.
    #
    # UWAGA NA SKUTEK UBOCZNY: `concurrency` trzyma tylko jeden przebieg
    # oczekujący, więc im dłuższy cykl, tym więcej tyknięć crona jest
    # anulowanych (tak zginął #665). Wyższy limit tego NIE naprawia — to jest
    # argument za skróceniem samego liczenia, gdy zacznie boleć świeżość.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zależności
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Przelicz okazje i wypchnij do Supabase
        working-directory: pipeline
        env:
          PYTHONIOENCODING: utf-8
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m footstats.jobs.cycle

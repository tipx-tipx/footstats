name: FootStats — magazyn historii drużyn

# PAMIĘĆ, NA KTÓREJ MODEL MOŻE SIĘ UCZYĆ (2026-08-17).
#
# Do dziś historia meczowa drużyn była pobierana w każdym cyklu, używana
# i wyrzucana — w bazie zostawały same agregaty („notuje 6,8 / dopuszcza 2,4").
# A rynki drużynowe to 93% produkcji, więc model dla prawie całej produkcji
# nie miał na czym się uczyć i uczyły się wyłącznie warstwy korekt na jego
# wyjściu. Pełny opis: nota na górze `footstats/jobs/magazyn_druzyn.py`.
#
# DLACZEGO OSOBNY JOB, A NIE W CYKLU: aktualizacja to 289 zapytań (~90 s)
# plus odczyt i zapis ~3,5 MB. Cykl i tak bywa dławiony przez cron GitHuba
# do co 1–3 h, więc doklejanie mu tego kosztu opóźniałoby publikację typów.
# Historia meczowa zmienia się raz na dobę i tyle wystarcza.

on:
  schedule:
    - cron: "20 4 * * *"     # 4:20 UTC = 6:20 czasu polskiego, po domknięciu doby
  workflow_dispatch: {}

permissions:
  contents: read

# WŁASNY group, nie footstats-cycle: magazyn nie dotyka `typy_log` ani
# `kupony_log`, więc nie ma z czym się ścigać — a wpisany do tej samej grupy
# blokowałby publikację typów na czas pobierania.
concurrency:
  group: footstats-magazyn
  cancel-in-progress: false

jobs:
  magazyn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalacja zależności
        working-directory: pipeline
        run: pip install -r requirements.txt

      - name: Dopisz świeże mecze do magazynu historii drużyn
        working-directory: pipeline
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/backfill_magazyn_druzyn.py --wszystkie
